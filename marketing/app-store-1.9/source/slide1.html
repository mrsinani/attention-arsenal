<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1320px;height:2868px;overflow:hidden;background:#000}
body{font-family:Outfit,system-ui,sans-serif;color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:110px 110px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%)}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;filter:blur(140px)}
.g1{background:rgba(59,130,246,.22);left:30%;top:18%;transform:translate(-50%,-50%)}
.g2{background:rgba(168,85,247,.16);left:75%;top:62%;transform:translate(-50%,-50%)}
.cap{position:absolute;top:220px;left:0;right:0;text-align:center;padding:0 140px}
h1{font-weight:700;font-size:112px;line-height:1.05;letter-spacing:-.035em}
h1 .b{display:block;white-space:nowrap;padding-bottom:.2em;margin-bottom:-.2em;background:linear-gradient(135deg,#fff 0%,#737373 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:44px auto 0;max-width:980px;font-size:46px;line-height:1.3;color:#a3a3a3;font-weight:400}
.phone{position:absolute;left:50%;top:860px;transform:translateX(-50%);width:1040px;padding:22px;border-radius:158px;
  background:linear-gradient(160deg,#2b2b2e,#0d0d0f 40%,#1c1c1f);
  box-shadow:0 0 0 2px #333,0 0 90px rgba(0,0,0,.9)}
.phone img{display:block;width:100%;border-radius:136px}
</style></head><body>
<div class="grid"></div><div class="glow g2"></div>
<div class="cap"><h1>the reminder that<span class="b">never gives up.</span></h1><p>it keeps nudging you<br>until it’s done.</p></div>
<div class="phone"><img src="01-list.png"></div>
</body></html>
