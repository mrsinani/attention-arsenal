<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:3840px;height:2560px;overflow:hidden;background:#000}
body{font-family:Outfit,system-ui,sans-serif;color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.035) 3px,transparent 3px);background-size:240px 240px}
.glow{position:absolute;border-radius:50%;filter:blur(300px);background:rgba(168,85,247,.14)}
h1{font-weight:700;letter-spacing:-.035em;line-height:1.05}
h1 .b{display:block;white-space:nowrap;padding-bottom:.2em;margin-bottom:-.2em;background:linear-gradient(135deg,#fff 0%,#737373 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.phone{position:absolute;padding:28px;border-radius:198px;background:linear-gradient(160deg,#2b2b2e,#0d0d0f 40%,#1c1c1f);box-shadow:0 0 0 4px #333,0 0 200px rgba(0,0,0,.9)}
.phone img{display:block;width:100%;border-radius:170px}
</style></head><body><div class="grid"></div>
<div class="glow" style="width:2000px;height:2000px;left:1900px;top:300px"></div>
<div style="position:absolute;left:836px;top:765px;width:1500px;height:1030px;display:flex;flex-direction:column;justify-content:center">
  <h1 style="font-size:195px;white-space:nowrap">the reminder that<span class="b">never gives up.</span></h1>
  <p style="margin-top:70px;font-size:104px;line-height:1.25;color:#a3a3a3">it keeps nudging you<br>until it’s done.</p>
</div>
<div class="phone" style="width:1300px;left:2440px;top:430px"><img src="01-list.png"></div></body></html>
