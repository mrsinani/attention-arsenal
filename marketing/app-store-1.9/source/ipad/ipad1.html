<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2064px;height:2752px;overflow:hidden;background:#000}
body{font-family:Outfit,system-ui,sans-serif;color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.035) 3px,transparent 3px);background-size:170px 170px;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 100%)}
.glow{position:absolute;width:1700px;height:1700px;border-radius:50%;filter:blur(220px);background:rgba(168,85,247,.16);left:72%;top:62%;transform:translate(-50%,-50%)}
.cap{position:absolute;top:250px;left:0;right:0;text-align:center;padding:0 220px}
h1{font-weight:700;font-size:150px;line-height:1.05;letter-spacing:-.035em;white-space:nowrap}
h1 .b{display:block;white-space:nowrap;padding-bottom:.2em;margin-bottom:-.2em;background:linear-gradient(135deg,#fff 0%,#737373 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:56px auto 0;font-size:64px;line-height:1.3;color:#a3a3a3}
.dev{position:absolute;left:50%;top:930px;transform:translateX(-50%);width:1620px;padding:34px;border-radius:118px;background:linear-gradient(160deg,#2b2b2e,#0d0d0f 40%,#1c1c1f);box-shadow:0 0 0 4px #333,0 0 140px rgba(0,0,0,.9)}
.dev img{display:block;width:100%;border-radius:86px}
</style></head><body><div class="grid"></div><div class="glow"></div>
<div class="cap"><h1>the reminder that<span class="b">never gives up.</span></h1><p>it keeps nudging you<br>until it’s done.</p></div>
<div class="dev"><img src="01-list.png"></div></body></html>
