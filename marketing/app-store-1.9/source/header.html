<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:3840px;height:1646px;overflow:hidden;background:#000}
body{font-family:Outfit,system-ui,sans-serif;color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 3px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.035) 3px,transparent 3px);background-size:240px 240px}
.glow{position:absolute;border-radius:50%;filter:blur(300px);background:rgba(168,85,247,.14)}
h1{font-weight:700;letter-spacing:-.035em;line-height:1.05}
h1 .b{display:block;white-space:nowrap;padding-bottom:.2em;margin-bottom:-.2em;background:linear-gradient(135deg,#fff 0%,#737373 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.phone{position:absolute;padding:21px;border-radius:152px;background:linear-gradient(160deg,#2b2b2e,#0d0d0f 40%,#1c1c1f);box-shadow:0 0 0 4px #333,0 0 200px rgba(0,0,0,.9)}
.phone img{display:block;width:100%;border-radius:131px}
</style></head><body><div class="grid"></div>
<div class="glow" style="width:1800px;height:1800px;left:1020px;top:-200px"></div>
<div class="phone" style="width:1000px;left:-60px;top:380px;transform:rotate(-7deg)"><img src="02-add.png"></div>
<div class="phone" style="width:1000px;left:2900px;top:380px;transform:rotate(7deg)"><img src="03-settings.png"></div>
<div style="position:absolute;left:1097px;top:493px;width:1646px;height:661px;display:flex;align-items:center;justify-content:center;text-align:center">
  <h1 style="font-size:190px">the reminder that<span class="b">never gives up.</span></h1>
</div></body></html>
